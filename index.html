<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENMD345 Çalışma Masası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a drafting desk. Sticky header + scrollable tab rail, one centred column (max 960px) on faint grid paper; blueprint navy ink with a single brass accent. */
:root{
  --paper:#F1F3F7; --surface:#FFFFFF; --sunk:#E8ECF3; --ink:#16213A; --muted:#58647D; --line:#D6DCE7;
  --brass:#A86A12; --brass-soft:#F6E7CC; --blue:#2C4A94; --blue-soft:#E3E9F7;
  --good:#1D7A50; --good-soft:#DDF1E6; --bad:#B23B26; --bad-soft:#F8E1DB; --plum:#7A3E8E; --plum-soft:#F1E4F5;
  --grid:rgba(44,74,148,.055);
  --f-display:"Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1525; --surface:#162036; --sunk:#1C2741; --ink:#E6EAF3; --muted:#9BA7C0; --line:#2A3651;
  --brass:#E2A848; --brass-soft:#3A2D16; --blue:#93ABF2; --blue-soft:#1F2C4D;
  --good:#52C68F; --good-soft:#163628; --bad:#F2907A; --bad-soft:#3E1F19; --plum:#D29BE6; --plum-soft:#33213C;
  --grid:rgba(147,171,242,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1525; --surface:#162036; --sunk:#1C2741; --ink:#E6EAF3; --muted:#9BA7C0; --line:#2A3651;
  --brass:#E2A848; --brass-soft:#3A2D16; --blue:#93ABF2; --blue-soft:#1F2C4D;
  --good:#52C68F; --good-soft:#163628; --bad:#F2907A; --bad-soft:#3E1F19; --plum:#D29BE6; --plum-soft:#33213C;
  --grid:rgba(147,171,242,.05); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:15.5px/1.6 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--blue)}
b,strong{font-weight:600}
small{font-size:.86em;color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{white-space:nowrap;font:800 1.12rem/1.1 var(--f-display);letter-spacing:-.01em;color:var(--ink);text-decoration:none;display:flex;align-items:baseline;gap:8px}
.brand span{font:500 .72rem var(--f-mono);color:var(--brass);letter-spacing:.06em}
.sync{font:400 .72rem var(--f-mono);color:var(--muted);white-space:nowrap}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync.on i{background:var(--good)}
.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -6px}
.rail::-webkit-scrollbar{display:none}
.rail a{flex:none;padding:8px 10px 10px;font-weight:500;font-size:.92rem;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.rail a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brass)}
.rail a .n{font:500 .7rem var(--f-mono);background:var(--sunk);border-radius:20px;padding:1px 6px;margin-left:4px;color:var(--muted)}

main{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 72px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.05;font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700;line-height:1.25}
p{margin:0}
.eyebrow{font:500 .74rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
.lead{color:var(--muted);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;text-decoration:none;cursor:pointer;min-height:42px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.brass{background:var(--brass);color:#fff;border-color:var(--brass)}
:root[data-theme="dark"] .btn.brass{color:#1b1406}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.brass{color:#1b1406}}
.btn.lv-easy{background:var(--good);color:#fff;border-color:var(--good)}
.btn.lv-medium{background:var(--brass);color:#fff;border-color:var(--brass)}
.btn.lv-hard{background:var(--bad);color:#fff;border-color:var(--bad)}
:root[data-theme="dark"] .btn.lv-easy,:root[data-theme="dark"] .btn.lv-medium,:root[data-theme="dark"] .btn.lv-hard{color:#141414}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.lv-easy,:root:not([data-theme="light"]) .btn.lv-medium,:root:not([data-theme="light"]) .btn.lv-hard{color:#141414}}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:default}
.pill{font:500 .72rem var(--f-mono);padding:1px 7px;border-radius:20px;background:var(--brass-soft);color:var(--brass)}
.btn.primary .pill{background:rgba(255,255,255,.16);color:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font:500 .85rem var(--f-mono);cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.9rem}
.seg button[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft);color:var(--ink)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.ref{font:500 .72rem var(--f-mono);color:var(--brass);background:var(--brass-soft);padding:2px 7px;border-radius:5px;white-space:nowrap}

/* home */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.cta-row{display:flex;flex-wrap:wrap;gap:8px}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.wk-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wk-n{font:800 1.6rem/1 var(--f-display);color:var(--brass)}
.wk h3{font-size:1rem}
.wk .tr{color:var(--muted);font-size:.88rem;margin-top:2px}
.wk .src{font:400 .74rem var(--f-mono);color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px}
.wk-stats{display:flex;justify-content:space-between;font:400 .74rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.wk-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.flowhint{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:st}
.flowhint div{border-left:2px solid var(--brass);padding:2px 0 2px 12px}
.flowhint b{display:block;font-family:var(--f-display)}
.flowhint span{font-size:.88rem;color:var(--muted)}

/* notes */
.wk-head{display:flex;flex-direction:column;gap:8px}
.wk-head .tr{color:var(--muted);font-size:1.02rem}
.big{background:var(--blue-soft);border-radius:var(--r);padding:14px 16px;border:1px solid var(--line)}
.big .eyebrow{color:var(--blue);margin-bottom:4px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font-size:.8rem;cursor:pointer;color:var(--muted);text-align:left}
.toc button:hover{color:var(--ink);border-color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:120px}
.note-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.note-h .tr{color:var(--muted);font-size:.9rem;margin-top:2px}
.pts{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.pts li::marker{color:var(--brass)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--sunk);font-weight:600;font-size:.84rem}
tr:last-child td{border-bottom:0}
td:first-child{min-width:120px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flow li{flex:1 1 150px;background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:.9rem;position:relative;min-width:0}
.flow li small{display:block;margin-top:2px}
.callout{border-left:3px solid var(--brass);background:var(--brass-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.93rem}
.searchbox{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
mark{background:var(--brass-soft);color:inherit;border-radius:3px;padding:0 2px}

/* flashcards */
.deck-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font:400 .8rem var(--f-mono);color:var(--muted)}
.leit{display:flex;gap:4px}
.leit span{flex:1;text-align:center;background:var(--sunk);border-radius:6px;padding:6px 2px;font:500 .72rem var(--f-mono);color:var(--muted)}
.leit span b{display:block;font-size:1rem;color:var(--ink);font-family:var(--f-display)}
.fcard{min-height:250px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;justify-content:center;cursor:pointer;text-align:left;width:100%;box-shadow:0 1px 0 var(--line),0 8px 24px -16px rgba(22,33,58,.35)}
.fcard .side{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.fcard .term{font:700 clamp(1.4rem,4.4vw,2rem)/1.15 var(--f-display);text-wrap:balance}
.fcard .trm{font:600 1.05rem var(--f-display);color:var(--brass)}
.fcard .exp{font-size:1.02rem}
.fcard .hint{color:var(--muted);font-size:.85rem}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grade .btn{justify-content:center}
.btn.no{border-color:var(--bad);color:var(--bad)}
.btn.yes{border-color:var(--good);color:var(--good)}

/* practice */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-size:.9rem;min-height:48px;word-break:break-word}
.tile.sel{border-color:var(--blue);background:var(--blue-soft)}
.tile.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.tile.err{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.order-pool,.order-ans{display:flex;flex-direction:column;gap:6px}
.order-ans{min-height:60px;border:1px dashed var(--line);border-radius:10px;padding:8px}
.order-ans .tile{display:flex;gap:10px;align-items:flex-start}
.order-ans .tile i{font:500 .8rem var(--f-mono);color:var(--brass);font-style:normal;padding-top:1px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.97rem}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--blue);background:var(--blue-soft)}
.opt .k{font:500 .78rem var(--f-mono);color:var(--muted);margin-right:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.qtext{font:600 1.12rem/1.4 var(--f-display)}
.qtr{color:var(--blue);font-size:.95rem;background:var(--blue-soft);border-radius:8px;padding:8px 10px}
.fb{border-radius:10px;padding:12px 14px;font-size:.94rem}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.timer{font:500 1rem var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.bigscore{font:800 3rem/1 var(--f-display);color:var(--brass);font-variant-numeric:tabular-nums}
.conf-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.conf-pair .panel{padding:12px}
.conf-pair h3{font-size:.98rem}
.conf-pair p{font-size:.88rem;color:var(--muted);margin-top:4px}
.stmt{font:600 1.08rem/1.4 var(--f-display);padding:14px;border-radius:10px;background:var(--sunk);text-align:center}
.tag-a{color:var(--blue)}.tag-b{color:var(--brass)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--brass)}
.progress{display:flex;justify-content:space-between;align-items:center;gap:8px;font:400 .82rem var(--f-mono);color:var(--muted)}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.rv.bad{border-left:3px solid var(--bad)}.rv.ok{border-left:3px solid var(--good)}.rv.guess{border-left:3px solid var(--brass)}
.rv .q{font-weight:600}
.lbl{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* people + glossary */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.person h3{font-size:1rem}
.person p{font-size:.9rem}
.wb{font:500 .7rem var(--f-mono);color:var(--blue);background:var(--blue-soft);border-radius:5px;padding:1px 6px;margin-right:4px}
.gl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.gl-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:4px 16px;padding:10px 14px;border-bottom:1px solid var(--line)}
.gl-row:last-child{border-bottom:0}
.gl-row .t{font-weight:600}
.gl-row .t small{display:block;color:var(--brass);font-weight:500}
.gl-row .d{font-size:.9rem}
.gl-letter{font:700 .8rem var(--f-mono);color:var(--brass);background:var(--sunk);padding:4px 14px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* study cards */
.kcards{display:flex;flex-direction:column;gap:12px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kc-h{display:flex;gap:10px;align-items:flex-start}
.kc-n{flex:none;font:700 .8rem/1 var(--f-mono);color:var(--brass);background:var(--brass-soft);border-radius:6px;padding:6px 7px;min-width:30px;text-align:center}
.kc-t{flex:1;min-width:0}
.kc-t .tr{color:var(--muted);font-size:.86rem;margin-top:1px}
.kc .pts{font-size:.95rem}
.ref-btn{border:1px solid transparent;cursor:pointer;font:500 .72rem var(--f-mono);flex:none}
.ref-btn:hover{border-color:var(--brass)}
.warn{font-size:.92rem;background:var(--blue-soft);border-radius:8px;padding:9px 11px;border-left:3px solid var(--blue)}
.warn b:first-child{color:var(--blue)}
.wk-btn{text-align:left;cursor:pointer;font:inherit;color:inherit}
.wk-btn:hover{border-color:var(--brass)}
.flash{box-shadow:0 0 0 3px var(--brass);transition:box-shadow .3s}
.gl+.gl{margin-top:0}
.gl{scroll-margin-top:120px}
@media (max-width:560px){.kc-h{flex-wrap:wrap}.kc-t{flex-basis:calc(100% - 44px)}.ref-btn{margin-left:40px}}

/* square study cards */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;grid-auto-flow:dense}
.kq{--c:var(--blue);--cs:var(--blue-soft);aspect-ratio:1/1;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;font-size:.88rem;line-height:1.45}
.kq.wide{grid-column:span 2;aspect-ratio:2/1}
.kq-d{--c:var(--blue);--cs:var(--blue-soft)}
.kq-c{--c:var(--brass);--cs:var(--brass-soft)}
.kq-l{--c:var(--good);--cs:var(--good-soft)}
.kq-p{--c:var(--plum);--cs:var(--plum-soft)}
.kq-u{--c:var(--bad);--cs:var(--bad-soft);background:var(--cs)}
.kq-type{font:500 .64rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
.kq-head h3{font-size:1rem;line-height:1.2}
.kq-tr{color:var(--muted);font-size:.8rem;margin-top:1px}
.kq-x{margin:0}
.kq-list{margin:0;padding-left:1em;display:flex;flex-direction:column;gap:2px}
.kq-list li::marker{color:var(--c)}
.kq-vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kq-vs>div{background:var(--cs);border-radius:8px;padding:7px 8px;min-width:0}
.kq-vs b{display:block;font-size:.84rem}
.kq-vs p{font-size:.82rem;margin-top:2px}
.kq-n{font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px;margin:0}
.kq-ref{margin-top:auto;align-self:flex-start}
/* grupla */
.gbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.gopt{display:flex;flex-direction:column;gap:3px;text-align:left}
.gopt small{color:var(--muted);font-size:.8rem}
.gsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.gcol{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.gcol h3{font-size:.98rem}
.gkey{font-size:.85rem;color:var(--brass);margin:3px 0 6px;font-weight:500}
.gcol ul{margin:0;padding-left:1.1em;font-size:.88rem}
/* tips */
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tip-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tip ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tip li{display:flex;flex-direction:column;background:var(--sunk);border-radius:8px;padding:7px 10px}
.tip li b{font-size:.92rem}
.tip li span{font-size:.88rem;color:var(--brass);font-weight:500}
.tip-ex{font-size:.8rem;color:var(--muted)}
@media (max-width:480px){.kgrid{grid-template-columns:1fr 1fr}.kq{aspect-ratio:auto;min-height:150px}.kq.wide{aspect-ratio:auto}}

/* ezber */
.ez-h{display:flex;align-items:center;gap:8px;font-size:1.15rem}
.ez-dot{width:10px;height:10px;border-radius:3px;background:var(--blue)}

.ez-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ez-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) auto;gap:4px 14px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:start;font-size:.92rem}
.ez-row:last-child{border-bottom:0}
.ez-warn{background:var(--bad-soft)}
.ez-seqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ez-seq{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--good);border-radius:12px;padding:12px 14px;min-width:0}
.ez-seq h3{font-size:.98rem}
.ez-seq ol{margin:8px 0 0;padding-left:1.4em;font-size:.9rem;display:flex;flex-direction:column;gap:3px}
.ez-seq li::marker{color:var(--good);font-family:var(--f-mono);font-weight:500}
.ez-seq .ez-ul{margin:8px 0 0;padding-left:1.1em;font-size:.9rem;display:flex;flex-direction:column;gap:3px}
@media (max-width:560px){.ez-row{grid-template-columns:1fr}.ez-row .ref{justify-self:start}}
@media (max-width:560px){
  .gl-row{grid-template-columns:1fr}
  .match{gap:6px}.tile{font-size:.84rem;padding:9px}
  .conf-pair{grid-template-columns:1fr}
  .note{padding:14px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* game */
.gm{display:flex;flex-direction:column;gap:14px}
.spr{width:96px;height:auto;image-rendering:pixelated;display:block}
.spr.sbig{width:120px}
.gm-hero-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.gm-wk:hover:not(.off){border-color:var(--blue)}
.gm-wk small{color:var(--muted);font-size:.8rem}
.gm-wk.off{opacity:.55;cursor:default}
.gm-mix{cursor:default}.gm-mix .row{margin-top:6px}
.spr.sbig{width:120px}
.gm-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hp{position:relative;width:160px;max-width:100%;height:18px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.hp i{position:absolute;inset:0 auto 0 0;background:var(--good);transition:width .4s}
.hp.foe i{background:var(--bad)}
.hp span{position:relative;display:block;text-align:center;font:600 .72rem/18px var(--f-mono);color:var(--ink)}
.gm-map{display:flex;flex-direction:column;gap:8px}

.gm-node div{display:flex;flex-direction:column;gap:2px}
.gm-node small{font-size:.82rem}
.gm-node.now{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass-soft)}
.gm-node.done{opacity:.6}
.gm-node.lock .spr{filter:grayscale(1) brightness(.6)}
.gm-notes{display:flex;flex-direction:column;gap:12px}
.gm-sticky{position:sticky;bottom:10px;z-index:2}
.gm-arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(var(--surface),var(--sunk))}
.gm-side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}

.gm-vs{align-self:center;font:700 1.1rem var(--f-display);color:var(--muted);text-align:center;min-width:70px}
.gm-log{display:inline-block;font:700 1.2rem var(--f-mono);animation:pop .5s ease}
.gm-log.hit{color:var(--good)}.gm-log.hurt{color:var(--bad)}.gm-log.block{color:var(--blue)}
.gm-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:22px}
.tag{font:500 .72rem var(--f-mono);padding:2px 7px;border-radius:10px;background:var(--sunk);border:1px solid var(--line)}
.tag.fire{background:var(--brass-soft);border-color:var(--brass)}
.spr.hit{animation:shake .45s ease,flash .45s ease}
.spr.hurt{animation:shake .45s ease,flash .45s ease}
.spr.atk{animation:lunge .35s ease}
.spr.dead{filter:grayscale(1);opacity:.6;transform:rotate(-8deg)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes flash{0%,60%{filter:brightness(2.2) saturate(.3)}100%{filter:none}}
@keyframes lunge{50%{transform:translateX(14px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.spr,.gm-log{animation:none!important}}
.gm-hint{border:1px dashed var(--brass);background:var(--brass-soft);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.gm-hint p{margin:0}
.gm-jokers{display:flex;flex-direction:column;gap:6px}
.gm-j{position:relative;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.gm-j span{font-size:1.2rem}.gm-j small{font-size:.85rem}
.gm-j em{font:600 .72rem var(--f-mono);font-style:normal;background:var(--sunk);border-radius:8px;padding:1px 6px}
.gm-j.on{border-color:var(--blue);background:var(--blue-soft)}
.gm-res{align-items:flex-start}
.gm-modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.gm-box{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.gm-box.wide{max-width:820px}
.gm-box p{margin:0}
.btn[disabled]{opacity:.5;cursor:default}
@media (max-width:560px){.spr{width:72px}.gm-arena{padding:10px;gap:4px}.hp{width:110px}.gm-vs{min-width:44px}}

.fm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fm h3{margin:0;font-size:1rem}
.fm p{margin:0;line-height:1.55}
.fm-x{display:flex;flex-direction:column;gap:12px}
.fm-x p+p{padding-top:12px;border-top:1px dashed var(--line)}
.fm-who{align-self:flex-start;font:500 .72rem var(--f-mono);padding:2px 8px;border-radius:10px;background:var(--plum-soft);color:var(--ink)}
@media (max-width:560px){.fm-grid{grid-template-columns:1fr}}

      "Ergodiklik <b>metinsel mekanizmanın</b> özelliğidir, dijital teknolojinin değil: rastgeleleştirmeyle danışılan eski bir Çin kehanet metni ergodiktir; standart bir e-kitap değildir."

es|Anlatı oyunu stratejileri",["The Theme Park: sürekli failliği feda eder","The Archive: zamansalı mekânsala takas eder","The Dissonance: anlatı tutarlılığını feda eder","The Procedural: yazarlı biçimi tamamen feda eder"],27,"u"],["Midterm Framework|Ara sınav çerçevesi",["Step 1: Disambiguate: sanal optik mi (yanılsama), skolastik mi (potansiyel)?","Step 2: Map the Mechanics: makine olarak metin (Ryan) mı, caydırma döngüsü (Baudrillard) mü?","Step 3: Define the Threat: doğrulanabilir aldatma mı (2. evre), gerçekliğin çöküşü mü (3. evre)?"],28]],"d":[["Hyperreal","Modelden üretilmiş, aslı olmayan gerçek; “more real than real”",6],["Kopuş noktası","2. ve 3. evre arası",10],["Deterrence örnekleri","Theme Park, Political Scandal, Staged Robbery",12],["Immersion'ın 3 türü","Spatial, Temporal, Emotional",18],["Recentering","Possible-worlds semantics; çelişkili dünyaya dalınmaz",17],["Danger Zone","Internal + Story",22],["Oyun stratejileri","Theme Park, Archive, Dissonance, Procedural",27],["Deepfake (Baudrillard)","Sahicilik kurumsal bir etikete döner",25]]}};

const FM={
1:[
{t:"Material sense vs. Institutional sense",tr:"Maddi anlam ve kurumsal anlam",who:"",x:"Maddi anlam taşıyıcıdır: plak oluğu, dijital dosya, yağlı boya. Kurumsal anlam örgüttür: basın, yayıncılık, yayınevi, sinema.",p:4},
{t:"The Conflation Error",tr:"Karıştırma hatası neden hata?",who:"",x:"Teknik bir değişimin (maddi anlam) kendiliğinden kurumsal sonuç doğurduğunu sanmaktır. Gazeteler dijitalleşme yüzünden değil, ilanların göçü ve borç yüzünden geriledi; bağlantı gösterilmeli, iddia edilmemeli.",p:5},
{t:"Who benefits from “novelty”?",tr:"Yeniliğin üç çıkar grubu",who:"",x:"Endüstri için yenilik pazarlama, hükümet için politikayı meşrulaştıran modernleşme anlatısı, akademi için fon ve kariyerdir. “Yeni” kelimesi olumlu çağrışım taşıdığı için ona karşı çıkan kendini savunmak zorunda kalır.",p:7},
{t:"Five characteristics: a map, not a checklist",tr:"Beş özellik neden kontrol listesi değil?",who:"Lister et al.",x:"Digitality, interactivity, hypertextuality, dispersal ve virtuality yeni medyayı anlamak için bir haritadır. Her yeni medya beşini birden taşımaz; bu yüzden tek bir nesne sınıfı tanımlamazlar.",p:8},
{t:"Dispersal vs. Concentration",tr:"Dağılma ve yoğunlaşma gerilimi",who:"",x:"Yayın yapma gücü milyonlara dağıldı ama neyin görüleceğine karar verme gücü birkaç firmada toplandı. Verimli analiz bu güçlerin çatıştığı yere bakar, çünkü güç çatışmada işler.",p:10},
{t:"Why “interactivity” is a loaded term",tr:"Etkileşim neden yüklü bir terim?",who:"",x:"Eskiden izleyicinin tamamen pasif olduğunu varsayar ve seçim, güçlenme, demokratikleşme gibi olumlu bir siyaset ithal eder. Oysa çoğu etkileşim, başkasının kurduğu bir menüden seçim yapmaktır.",p:11},
{t:"Technological Determinism vs. Cultural Materialism",tr:"Teknolojik determinizm ve kültürel materyalizm",who:"Williams",x:"Determinizmde teknoloji kendi başına gelişir ve topluma etki dayatır. Kültürel materyalizmde (Williams) teknolojiler toplumsal niyetlerle seçilir; fail insanlardır.",p:12},
{t:"Winston: Filter 1 vs. Filter 2",tr:"Winston'ın iki filtresi",who:"Winston",x:"Birinci filtre (supervening social necessity) bir ihtiyacın prototipi üretime çekmesidir. İkinci filtre (suppression of radical potential) mevcut güçlerin patent davası ve düzenlemeyle yeniliğin yıkıcılığını frenlemesidir.",p:13},
{t:"The Working Posture",tr:"Çalışma duruşu: iki tarafı da reddet",who:"",x:"Teknik özellikler kısıtlar ve olanak verir ama sonucu belirlemez. Arada tasarım kararları, iş modelleri, düzenlemeler ve kullanıcı uyarlamaları vardır.",p:14},
{t:"Medium = Technology + Protocols",tr:"Gitelman: cihaz neden tek başına medium değil?",who:"Gitelman",x:"Medium, teknolojik biçim ile protokollerin (normlar, hukuk, kurumsal işlemler, görgü) birleşimidir. Telefonsal pratikleri olmayan bir telefon sadece bir nesnedir.",p:15},
{t:"Emergence vs. Breakdown",tr:"Protokoller ne zaman görünür?",who:"Gitelman",x:"Yerleşen protokoller görünmez olur. Doğarken tartışıldıkları için (emergence) ya da çiğnendiklerinde öfke doğduğu için (breakdown) görünürler.",p:18},
{t:"Supersession vs. Persistence",tr:"Yerini alma anlatısı neden yanlış?",who:"",x:"Yerini alma anlatısı bugünü kaçınılmaz bir sonuç gibi gösterir. Gerçekte eski medya sürer, melezleşir ve yeni nişlere göçer (mektup, kitap, plak).",p:19},
{t:"The Archive Asymmetry",tr:"Arşiv asimetrisi",who:"",x:"Kişi için dijital kayıt fazla dayanıklıdır: veri silinmez, aranabilir kalır. Tarihçi için ise fazla kırılgandır: formatlar okunamaz olur, bağlantılar çürür.",p:22},
{t:"Utopia vs. Panic",tr:"Tekrar döngüsünün iki kutbu",who:"",x:"Ütopya her yeni teknolojinin insanlığı birleştireceğini, panik gençliği ve sosyalliği bozacağını söyler. İkisi de teknolojiye tek başına büyülü güç atfeder; bu yüzden ikisine karşı da dikkatli olmak gerekir.",p:23}
],
2:[
{t:"Content paradigm vs. Toronto School",tr:"İçerik paradigması ve Toronto Okulu",who:"",x:"Yüzyıl ortası araştırma gönderici → içerik → alıcı modeliyle mesajın etkisini (ikna, tutum) ölçer. Toronto Okulu içerik yerine ortamın yapısal etkisine bakar.",p:3},
{t:"Innis (Path A) vs. McLuhan (Path B)",tr:"İki yol: güç ve algı",who:"Innis · McLuhan",x:"Innis ortamın kurumları ve gücü nasıl biçimlendirdiğini sorar; dili kurumsal ve ekonomiktir. McLuhan ortamın duyuları ve algıyı nasıl yeniden düzenlediğini sorar; dili estetik ve psikolojiktir.",p:4},
{t:"Innis's cost loop",tr:"Maliyet neden güç demek?",who:"Innis",x:"Yazı yüzeyinin maddi özelliği yazmanın maliyetini belirler; pahalıysa sadece bütçesi ve zamanı olan grup bilgiye erişir. Bu grup bilgiyi tekeline alır ve toplum o kurumu kayırır.",p:6},
{t:"Time-biased vs. Space-biased",tr:"Zaman eğilimli ve mekân eğilimli ortam",who:"Innis",x:"Taş ve kil gibi ağır, dayanıklı ortamlar zamanda süreklilik ve gelenek sağlar. Papirüs, kâğıt ve radyo gibi hafif ortamlar uzağa taşınır ve imparatorluk yönetimine yarar.",p:7},
{t:"The Problem of Balance",tr:"Denge sorunu ve “A Plea for Time”",who:"Innis",x:"İstikrarlı uygarlıklar iki eğilimi dengeler; biri baskın olunca çöküş gelir. Innis'e göre 20. yüzyıl Batı'sı aşırı mekân eğilimlidir: haber döngüsü süreyi yok eder.",p:9},
{t:"Extensions & sense ratios",tr:"Uzantılar neden algıyı değiştirir?",who:"McLuhan",x:"Her teknoloji bedenin bir uzantısıdır: tekerlek ayağı, matbaa gözü, elektrik sinir sistemini uzatır. Bir duyuyu güçlendirince duyular arasındaki oran ve dolayısıyla düşünme biçimi değişir.",p:10},
{t:"Content as distraction",tr:"İçerik neden dikkat dağıtıcı?",who:"McLuhan",x:"İçerik, hırsızın bekçi köpeğine attığı et gibidir: biz ona bakarken medium yapısal işini yapar. McLuhan içeriği önemsiz saymaz, onu dikkat dağıtıcı sayar.",p:12},
{t:"The Cargo vs. The Structure",tr:"Yük ve yapı",who:"McLuhan",x:"Tren ne taşırsa taşısın (yük), toplumu asıl değiştiren rayın kendisidir: standart zaman ve yeni şehirler (yapı). Elektrik ışığı hiç mesaj taşımaz ama gece ile gündüzün sınırını kaldırır.",p:14},
{t:"Mechanical Age vs. Electric Age",tr:"Mekanik Çağ ve Elektrik Çağı",who:"McLuhan",x:"Mekanik Çağ alfabe ve matbaayla parçalanmış, sıralı, uzmanlaşmış bir düzendir (simgesi montaj hattı). Elektrik Çağı anlık ve eşzamanlıdır, ayrılanı yeniden birleştirir (simgesi otomasyon).",p:15},
{t:"Hot vs. Cool",tr:"Sıcak ve soğuk medium",who:"McLuhan",x:"Sıcak medium yüksek tanımlıdır ve bilgiyle doludur, izleyiciye az iş kalır. Soğuk medium düşük tanımlıdır, izleyici boşlukları doldurur ve katılım artar.",p:16},
{t:"The Tetrad",tr:"Tetrad'ın dört sorusu",who:"McLuhan",x:"Her medium için dört soru sorulur: neyi güçlendirir, neyi gözden düşürür, neyi geri getirir, uca itilince neye dönüşür. Böylece bir medium'un etkisi tek yönlü değil, dört yönden haritalanır.",p:16},
{t:"The 360-degree framework",tr:"Innis ve McLuhan neden birlikte?",who:"Innis · McLuhan",x:"McLuhan medya ortamının nasıl hissettirdiğini anlatır ama kimin çıkarına hizmet ettiğini açıklayamaz. Innis bu güç haritasını ekler; ikisi birlikte tam resmi verir.",p:19}
],
3:[
{t:"Two histories converge",tr:"İki tarih neden birleşti?",who:"Manovich",x:"Bir yanda kültürü saklayan medya (fotoğraf, sinema), öbür yanda sayı işleyen hesaplama (Babbage, Turing) vardı. Medya sayıya çevrilince hesaplamanın bütün araçları kültüre uygulanabilir oldu: programlanabilir medya.",p:3},
{t:"What new media is NOT",tr:"Yeni medya hakkındaki yanlış iddialar",who:"Manovich",x:"Ayrıklık dijital bir icat değildir (harfler, film kareleri) ve dijital kopya bozulmaz. Etkileşim de özgürleşme değildir; kullanıcı başkasının kurduğu çağrışımları izler.",p:4},
{t:"The dependency cascade",tr:"Beş ilke neden birbirine bağlı?",who:"Manovich",x:"Medya sayısal veri (numerical representation) ve ayrı parçalar (modularity) olunca, yazılım onları otomatik işleyebilir (automation) ve her seferinde farklı üretebilir (variability). Sonunda yazılımın kategorileri kültürün kategorilerini biçimler (transcoding).",p:6},
{t:"Automation: making vs. finding",tr:"Otomasyon emeği nasıl değiştirir?",who:"Manovich",x:"Medya sonsuz bollukta olunca asıl iş üretmek değil, bulmak ve filtrelemektir. Arama motorları ve öneri sistemleri bu yüzden kültürün merkezindedir.",p:8},
{t:"Variability vs. Fixity",tr:"Değişkenlik ve sabitlik",who:"Manovich",x:"Yeni medyada nesne veri artı talimattır ve istek anında oluşur; değişkenlik varsayılandır. Sabit bir kopya ise bilerek ve zorla sağlanır.",p:9},
{t:"Cultural layer vs. Computer layer",tr:"Transcoding: hangi katman hangisini biçimler?",who:"Manovich",x:"Kültürel katman tür, anlatı, ruh hali gibi kavramlarla; bilgisayar katmanı süreç, indeks, fonksiyon, değişken gibi kavramlarla düşünür. Transcoding, bilgisayar katmanının kültürel katmanı biçimlendirmesidir (profil, klasör, akış).",p:10},
{t:"Classical vs. Dynamic vs. Real-Time Screen",tr:"Üç ekran",who:"Manovich",x:"Klasik ekran (resim) durağan bir sahne, dinamik ekran (sinema) hareketsiz izleyiciye geçmiş bir olay gösterir. Gerçek zamanlı ekran (bilgisayar) sürekli güncellenen şimdiyi gösterir ve kullanıcı müdahale eder.",p:11},
{t:"Montage vs. Compositing",tr:"Görünür kesik ve görünmez dikiş",who:"Manovich",x:"Avangart sinema ayrı çekimleri görünür biçimde yan yana koyar (montaj). Yazılım katmanları görünmez biçimde birleştirir (compositing); yaratım boş tuvalden değil, hazır öğeler kütüphanesinden başlar.",p:14},
{t:"Database vs. Narrative",tr:"Veritabanı ve anlatı",who:"Manovich",x:"Veritabanı eşdeğer öğelerin sırasız listesidir; düzen ancak sorgu anında oluşur. Anlatı ise olayları neden-sonuçla bağlayan bir gidişattır.",p:16},
{t:"Paradigm vs. Syntagm (inversion)",tr:"Paradigma ve sentagma neden yer değiştirdi?",who:"Manovich",x:"Dilde söylenen cümle (syntagm) gerçek, seçenekler (paradigm) sanaldır. Yeni medyada veritabanı (paradigm) diskte gerçekten durur, kullanıcının izlediği yol (syntagm) ise sanaldır.",p:17},
{t:"Collection, Schema, Interface",tr:"Medya analizi üçgeni",who:"Manovich",x:"Koleksiyon veridir, şema neyin kaydedilebileceğini belirleyen kurallardır, arayüz kullanıcıya gösterilen tek bir geçiştir. Sadece arayüze bakan analiz, ekranın arkasındaki kararları kaçırır.",p:18},
{t:"Archive vs. Database",tr:"Arşiv ve veritabanı farklı sorular sorar",who:"",x:"Arşiv “ne saklandı ve neden?” diye sorar. Veritabanı “burada en baştan neyin kaydedilmesi mümkün?” diye sorar; şemaya sığmayan deneyim tamamen görünmez olur.",p:19},
{t:"2001 feed vs. today's ranked feed",tr:"Akışı kim kuruyor?",who:"",x:"2001'de yolu (sentagma) kullanıcı kendi seçimleriyle kuruyordu. Bugün sistem, kullanıcı modeli ve şirket hedefleriyle yolu kullanıcı adına kuruyor.",p:23}
],
4:[
{t:"Three inadequate models",tr:"Replacement, Isolation, Progress neden yetersiz?",who:"",x:"Yerini alma modeli eski medyanın öldüğünü sanır, yalıtım modeli medium'u diğerlerinden bağımsız düşünür, ilerleme modeli tarihi daha gerçekçiye doğru bir yürüyüş sanır. Üçü de medyalar arası ilişkiyi kaçırır.",p:4},
{t:"Remediation vs. Media Archaeology",tr:"İki çerçeve neden anlaşamaz?",who:"Bolter & Grusin · Huhtamo & Parikka",x:"Remediation düzenli ve birikimli bir ödünç almadır; hayatta kalan medyanın soyunu izler. Medya arkeolojisi kesintilere, çıkmaz sokaklara ve unutulmuş alternatiflere bakar.",p:5},
{t:"Immediacy vs. Hypermediacy",tr:"Dolaysızlık ve aşırı aracılık",who:"Bolter & Grusin",x:"Immediacy medium'u gizler, izleyici aradaki aracıyı unutur (panorama, VR). Hypermediacy medium'u gösterir, gerçeklik hissini çok sayıda pencere ve kanaldan alır (haber ekranı, pencereli arayüz).",p:7},
{t:"Degrees of remediation",tr:"Remediation'ın dört derecesi",who:"Bolter & Grusin",x:"Minimal transfer eskiyi aynen aktarır, enhancement korur ama yeni özellik ekler, absorption eskiyi yutup dikişleri gizler. Refashioning en saldırganıdır: öncülün eksiğini onardığını iddia eder (sinemayı “düzelten” VR).",p:10},
{t:"Remediation vs. Reverse remediation",tr:"Ödünç almanın yönü",who:"",x:"Normalde yeni medium eskiden ödünç alır. Ters remediation'da eski medium rekabet tehdidine karşı yeniden ödünç alır (sinemanın oyun dilini benimsemesi, TV'nin dikey kadrajı).",p:11},
{t:"Objections to remediation",tr:"Remediation'a üç itiraz",who:"",x:"Kavram her şeyi açıklarsa hiçbir şeyi açıklamaz (capaciousness), hâlâ düz bir soy ağacı kurar (linearity) ve politik ekonomiyi yok sayar (formalism). Bir firmanın standardının neden kazandığını açıklayamaz.",p:12},
{t:"Foucault vs. Kittler vs. Benjamin",tr:"Medya arkeolojisinin kökleri",who:"Foucault · Kittler · Benjamin",x:"Foucault bir dönemde neyin söylenebileceğini belirleyen kuralları, Kittler medyanın kendisini (devre şeması) inceler. Benjamin ticari kültürün döküntülerinin (pasajlar, panoramalar) dönemi anıtlardan iyi anlattığını söyler.",p:15},
{t:"Recurrence vs. Simultaneity vs. Deep Time",tr:"Alternatif zaman biçimleri",who:"",x:"Recurrence aynı vaat ve korkuların farklı makinelerle geri gelmesidir; simultaneity farklı medya rejimlerinin aynı anda yaşamasıdır. Deep time'da benzerlik sıranın yerini alır; yüzyıllar arası iki cihaz akraba olabilir.",p:16},
{t:"Topos",tr:"Topos neden önemli?",who:"",x:"Topos, yüzyıllardır tekrar eden kültürel bir kalıptır (“bu gençliği bozacak”, “bu insanlığı birleştirecek”). Bir tanıtım iddiası topos'a uyuyorsa, teknolojinin kanıtı değil eski bir fantezinin geri dönüşüdür.",p:17},
{t:"Dead media vs. Imaginary media",tr:"Ölü medya ve hayali medya",who:"",x:"Ölü medya yapılmış, kullanılmış ve terk edilmiş teknolojilerdir; kazanan soyun kaçınılmaz olmadığını kanıtlar. Hayali medya hiç yapılmamış önerilerdir; arzunun ufkunu ve mühendisliği neyin yönlendirdiğini gösterir.",p:18},
{t:"Discursive wing vs. Material wing",tr:"Medya arkeolojisinin iki kanadı",who:"",x:"Söylemsel kanat patentleri, reklamları ve retoriği okur. Maddi kanat eski makineleri kurar, onarır, söker ve bilerek yanlış kullanır.",p:19},
{t:"The video call",tr:"Bir vakada iki mercek",who:"",x:"Remediation merceği görüntülü görüşmeyi telefonu “düzelten” bir yeniden biçimlendirme olarak görür; vaat dolaysızlıktı ama ızgara ve panellerle aşırı aracılığa döndü. Arkeoloji merceği ise uzaktan görme fantezisini (topos) ve teknik değil kurumsal nedenlerle batan eski videotelefonları hatırlatır.",p:24}
],
5:[
{t:"Castells vs. Van Dijk",tr:"Ağlar yerini mi aldı, sardı mı?",who:"Castells · Van Dijk",x:"Castells'e göre ağlar birey ve örgüt gibi eski yapı taşlarının yerini aldı. Van Dijk'a göre bu birimler sürüyor; ağlar onları koordine eden sinir sistemidir.",p:3},
{t:"Weak ties vs. Preferential attachment",tr:"Ağ matematiğinin iki ilkesi",who:"",x:"Zayıf bağlar farklı çevrelere köprü kurduğu için yeni bilgi getirir. Tercihli bağlanmada yeni düğümler zaten popüler olana bağlanır; büyük daha da büyür.",p:6},
{t:"Three colliding processes",tr:"Ağ toplumu neden teknolojik olarak belirlenmiş değil?",who:"Castells",x:"Kapitalizmin yeniden yapılanması, bilgi teknolojisi devrimi ve 1960-70'lerin kültürel hareketleri birbirinden bağımsız olarak çarpıştı. Hiçbiri diğerine neden olmadığı için teknoloji tek başına açıklama değildir.",p:7},
{t:"Industrialism vs. Informationalism",tr:"Sanayicilik ve enformasyonalizm",who:"Castells",x:"Sanayicilikte verimlilik yeni enerji kaynaklarından gelir ve kitlesel üretim ulusal pazarlara yöneliktir. Enformasyonalizmde bilgi bilgiye etki eder ve sermaye küresel, gerçek zamanlı tek bir sistem olarak işler.",p:8},
{t:"Expand or bypass",tr:"Ağın mantığı",who:"Castells",x:"Ağ, kodlarını ve protokollerini paylaşan düğümleri içine alarak sınırsız büyür. Değer taşımayan düğümleri sömürmez; kapatır ve etrafından dolaşır.",p:10},
{t:"Programming vs. Switching",tr:"Güç nerede?",who:"Castells",x:"Programlama bir ağı kurup hedeflerini, kodlarını ve kurallarını belirleme gücüdür. Anahtarlama farklı ağları birbirine bağlayıp koordine etme gücüdür.",p:11},
{t:"Space of flows vs. Space of places",tr:"Akışlar mekânı",who:"Castells",x:"Akışlar mekânı kararların alındığı ağ katmanlarıdır: maddi devreler, küresel şehir düğümleri ve elitlerin standart ortamları. İnsanların çoğunun hayatı ise hâlâ yerlerde örgütlenir; akışlarda alınan kararlarla yerlerde yaşayanlar arasında siyasi gerilim doğar.",p:12},
{t:"Self-programmable vs. Generic labor",tr:"İşin kutuplaşması",who:"Castells",x:"Kendini programlayabilen emek yeni beceriler kazanır ve görevi yeniden tanımlar. Jenerik emek ölçülebilir işler yapar; bu yüzden otomatikleştirilebilir, taşınabilir ya da değiştirilebilir.",p:14},
{t:"The four dimensions of interactivity",tr:"Etkileşim teşhisi",who:"Van Dijk",x:"Mekân (cevap verebilir miyim?), zaman (anında mı?), davranış (birlikte rol değiştiriyor muyuz?) ve zihin (gerçekten anlıyor muyuz?) boyutları vardır. Platformlar mekân ve zamanda iyidir ama zihinsel boyutta çoğu zaman başarısız olur.",p:17},
{t:"Supplement, not replacement",tr:"Medya kapasiteleri neden birbirini tamamlar?",who:"Van Dijk",x:"Ağ medyası erişimde, yüz yüze iletişim zenginlikte rakipsizdir. Hiçbir medium her boyutta üstün olmadığı için yeni medya eskisinin yerini almaz, onu tamamlar.",p:18},
{t:"Network externality & trend amplification",tr:"Ağ yasaları neden tekel üretir?",who:"Van Dijk",x:"Ağın değeri katılımcı sayısıyla arttığı için büyük olan daha da büyür ve kullanıcılar kilitlenir (externality). Ağlar var olan eğilimleri ve eşitsizlikleri de büyütür (trend amplification).",p:19},
{t:"Platform monopoly (Synthesis I)",tr:"İki kuramı birleştirmek",who:"Castells · Van Dijk",x:"Platform ayrı ağları bağlayıp görünürlüğü belirler (Castells'in anahtarlama gücü) ve değer katılımcıyla büyüdüğü için ayrılmak pahalıdır (Van Dijk'ın dışsallık yasası). Bu yüzden yoğunlaşma için rekabet karşıtı davranış bile gerekmez.",p:22},
{t:"Two hazards of network vocabulary",tr:"Ağ dilinin iki tehlikesi",who:"",x:"Her şey ağ olarak çizilebildiği için “ağ” demek hep doğru ama bilgisizdir; önce düğüm ne, ne akıyor, protokolü kim koyuyor sorulmalı. Düğüm-çizgi çizimi eşitlik ima eder ama ağlar yapısal olarak eşitsizlik ve yoğunlaşma üretir.",p:24}
],
6:[
{t:"Three registers",tr:"Neden üç ayrı kayıt?",who:"Aarseth · Jenkins · Bruns",x:"“Etkileşim” çok farklı olguları tek kelimede toplar, bu yüzden üç ayrı soru sorulur. Aarseth sistemin ne istediğini, Jenkins insanların ne yaptığını, Bruns ortak işin nasıl örgütlendiğini sorar.",p:3},
{t:"Nelson's hypertext vs. the WWW",tr:"Hipermetnin vaadi ve inşa edilen web",who:"Nelson · Berners-Lee",x:"Nelson iki yönlü bağlantılar ve transclusion önermişti. WWW tek yönlü bağlantılar kullandı ve sürüm korumadı; bu teknik zorunluluk değil, büyük bir tasarım tercihiydi.",p:4},
{t:"The utopian trap",tr:"1990'ların ütopya tuzağı",who:"Landow · Bolter",x:"Yeni bir teknik kapasite bulunur, ona uyan bir kuram eşleştirilir, teknoloji o dille anlatılır ve sonunda özgürleşme iddiası eklenir. Aynı yapı bugün blokzincir ve üretken yapay zekâ iddialarında tekrar ediyor.",p:5},
{t:"Trivial vs. Non-trivial effort",tr:"Ergodik metin",who:"Aarseth",x:"Geleneksel okuma önemsiz çabadır: sayfa çevirirsin, metin değişmez. Ergodik metinde okurun eylemi metnin hangi kısmının üretileceğini belirler.",p:8},
{t:"Texton, Traversal function, Scripton",tr:"Makine olarak metin",who:"Aarseth",x:"Textonlar metinde depolanan işaretlerdir (veritabanı), scriptonlar okura görünen dizidir (çıktı). Traversal function textonları scriptonlara dönüştüren motordur.",p:9},
{t:"Exploration vs. Configuration vs. Textonic",tr:"Kullanıcı işlevleri",who:"Aarseth",x:"Exploration yol seçmektir (link izlemek), configuration öğeleri düzenleyip bileşimi değiştirmektir (avatar donatmak). Textonic metne kalıcı yeni parça eklemektir (wiki düzenlemek).",p:10},
{t:"Black box fallacy vs. True convergence",tr:"Yakınsama nerede olur?",who:"Jenkins",x:"Endüstri bütün cihazların tek bir “her şey cihazında” birleşeceğini bekledi ve yanıldı. Gerçek yakınsama kültüreldir: cihazlar değişir, insanların alışkanlıkları sürer ve platformlar arasında göç eder.",p:13},
{t:"Collective intelligence",tr:"Kolektif zekâ neye ihtiyaç duyar?",who:"Lévy · Jenkins",x:"Dağınık topluluklar bilgiyi birleştirince grup, hiçbir bireyin bilmediğini bilir. Bunun için düşük katkı engeli, görünür arşiv, gayriresmî itibar ve ortak bir ilgi nesnesi gerekir.",p:14},
{t:"Transmedia: aesthetic vs. commercial",tr:"Transmedya anlatıcılığının iki yüzü",who:"Jenkins",x:"Estetik olarak her medium hikâyeye yeni bir parça katar ve izleyicilerin parçaları birlikte birleştirmesini ister. Ticari olarak izleyiciyi bir franchise'a bağlamanın güçlü bir pazarlama tekniğidir.",p:15},
{t:"Industrial chain vs. Produsage network",tr:"Üretim zinciri ve produsage",who:"Bruns",x:"Endüstriyel zincir tek yönlüdür: hammadde → üretici → bitmiş ürün → tüketici. Produsage ağında yön yoktur, ürün hiç bitmez ve kullanıcılar aynı anda üreticidir.",p:18},
{t:"Equipotentiality vs. Granularity",tr:"Produsage ne zaman işler?",who:"Bruns",x:"Kimin iyi katkı yapacağı önceden bilinemez; bu yüzden katkı ucuz, geri alma daha da ucuz olmalıdır. Proje de koordinasyon yükü olmayan çok küçük parçalara bölünebilmelidir.",p:20},
{t:"Gatekeeping vs. Gatewatching",tr:"Gazeteciliğin işlevi nasıl değişti?",who:"Bruns",x:"Eskiden gazeteci kapıda neyin yayımlanacağını seçerdi. Darboğaz kalkınca iş, bol çıktıyı küratörlemek, bağlamına oturtmak ve açıklamaya kaydı.",p:21},
{t:"Capacity vs. Exploitation",tr:"Büyük tartışma",who:"",x:"Katılımcı okumaya göre kullanıcılar örgütlenme ve topluluk kurma gibi gerçek kapasiteler kazandı. Dijital emek okumasına göre bu faaliyet, onu yaratmayan platform sahiplerine büyük değer üretiyor.",p:24},
{t:"The shared blind spot",tr:"Üç yazarın ortak kör noktası",who:"Aarseth · Jenkins · Bruns",x:"Üçü de sunucuları, kullanım koşullarını, sahipliği ve algoritmaları incelemedi, çünkü internetin ortak bir alan sayıldığı dönemde yazdılar. Bu yüzden son soru, katılımın gerçekleştiği altyapının sahibinin kim olduğudur.",p:23}
],
7:[
{t:"Optical virtual vs. Scholastic virtual",tr:"Sanalın iki soyu",who:"Baudrillard · Bergson/Deleuze",x:"Optik sanal görünen ama olmayandır (aynadaki görüntü); sahte ve gerçeklikten eksiltici sayılır. Skolastik/Deleuzecü sanal ise güçte var olan potansiyeldir (palamuttaki meşe); kendi başına gerçektir.",p:4},
{t:"Classical critique vs. Baudrillard",tr:"Maskenin arkası",who:"Baudrillard",x:"Klasik eleştiri temsilin arkasında saklı bir gerçeklik olduğunu varsayar ve onu ifşa eder. Baudrillard'a göre artık maskenin arkasında hiçbir şey yoktur; ifşa edilecek bir şey kalmamıştır.",p:5},
{t:"Map vs. Territory",tr:"Borges fablının tersine çevrilmesi",who:"Baudrillard",x:"Klasik fabılda harita gerçek toprağı temsil eder. Baudrillard'da model (harita) önce gelir ve gerçeği üretir; toprak geride kalan bir kalıntıdır.",p:6},
{t:"Dissimulation vs. Simulation",tr:"Gizleme ve simülasyon",who:"Baudrillard",x:"Gizleme sahip olduğunu yokmuş gibi göstermektir; muayene yalanı ortaya çıkarır. Simülasyon sahip olmadığının gerçek işaretlerini üretmektir; belirtiler gerçek olduğu için doğru ile yanlışın ayrımı çöker.",p:7},
{t:"Phases 1-2 vs. Phases 3-4",tr:"Kopuş nerede?",who:"Baudrillard",x:"İlk iki evrede imge gerçeği yansıtır ya da bozar; arkada gerçek olduğu için eleştiri maskeyi indirebilir. Üçüncü ve dördüncü evrede imge gerçeğin yokluğunu maskeler ya da hiçbir gerçekle ilişkisi kalmaz; ifşa boş bir gösteriye döner.",p:10},
{t:"Three orders of simulacra",tr:"Taklit, seri, model",who:"Baudrillard",x:"Birinci düzen doğal orijinali taklit eder (mermeri taklit eden alçı), ikinci düzende makineler özdeş seriler üretir ve orijinal sorusu kaybolur. Üçüncü düzende model ve kod gerçekten önce gelir ve onu üretir (genetik kod, kamuoyu yoklamaları).",p:11},
{t:"The engine of deterrence",tr:"Sahte olan neden var?",who:"Baudrillard",x:"Açıkça sahte ilan edilen bir şey (tema parkı, skandal), geri kalanın gerçek olduğu inancını korur. Bu yüzden “bu istisna ilanı başka yerde neyi sorgusuz geçiriyor?” diye sorulur.",p:12},
{t:"Implosion of meaning",tr:"Ölçüm gerçeği nasıl üretir?",who:"Baudrillard",x:"Kamuoyu yoklaması önce soruları ve ikili seçenekleri kurar, sonra yayımlanan sonuç halkı etkiler ve ölçtüğünü iddia ettiği gerçeği belirler. Medya anlamı sürekli dolaştırarak nötrleştirir.",p:13},
{t:"Baudrillard vs. Eco",tr:"Evrensel ve sınırlı iddia",who:"Baudrillard · Eco",x:"Baudrillard'a göre hipergerçek çağın evrensel koşuludur ve yanlışlanamaz. Eco ise onu belirli kurumların belirli yerlerde ürettiği bir şey olarak inceler; evrensel kuram fazlasını açıklayamıyorsa sınırlı iddia tercih edilir.",p:15},
{t:"Suspension vs. Recentering",tr:"İçine dalmanın iki modeli",who:"Ryan",x:"Eski model okurun eleştirel aklını kapattığını söyler ama tutarsızlıkların neden rahatsız ettiğini açıklayamaz. Ryan'ın modelinde okur hikâye dünyasını geçici olarak gerçek dünya yapar; bu yüzden tutarsızlık onu dışarı atar.",p:17},
{t:"Spatial vs. Temporal vs. Emotional immersion",tr:"İçine dalmanın üç boyutu",who:"Ryan",x:"Mekânsal içine dalma bir yerde bulunma hissidir, zamansal içine dalma sonra ne olacağını merak etmektir, duygusal içine dalma karakterlere bağlanmaktır. Boyutlar bağımsız değişir; bir oyun mekânda güçlü, zamanda zayıf olabilir.",p:18},
{t:"Text as World vs. Text as Machine",tr:"Ryan'ın iki kutbu",who:"Ryan",x:"Dünya olarak metin mekân, karakter ve tutarlılığa bakar (immersion). Makine olarak metin mekanizma, seçenek ve kurallara bakar (interactivity).",p:20},
{t:"Authored shape vs. Participant freedom",tr:"Etkileşimli anlatının değişmez sorunu",who:"Ryan",x:"Anlatı, açıklamaların tam zamanında gelmesi için seçim ve sıralamaya dayanır; etkileşim ise kullanıcının sırayı bozmasını ister. Özgürlük arttıkça biçimli deneyimi korumak zorlaşır; en keskin hali “internal + story” tehlike bölgesidir.",p:22},
{t:"Baudrillard vs. Ryan",tr:"Büyük anlaşmazlık",who:"Baudrillard · Ryan",x:"Baudrillard toplum düzeyinde bakar: model gerçeği üretir ve temsil çöktü. Ryan birey düzeyinde bakar: kullanıcılar dünyalar kurar ve onları gerçeklikten ayırabilir.",p:23}
]
};
</script>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
function hid(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))|0;return (h>>>0).toString(36)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function strip(s){return String(s).replace(/<[^>]+>/g,"")}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const wl=n=>"W0"+n;
const ref=(w,p)=>`<span class="ref">${wl(w)} · s.${p}</span>`;
const refLink=(w,p)=>`<button class="ref ref-btn" data-act="tonote" data-w="${w}" data-p="${p}" title="Ayrıntılı notu aç">${wl(w)} · s.${p} →</button>`;
const lower=s=>strip(s).toLocaleLowerCase("tr");
const mins=w=>Math.max(3,Math.round(strip(JSON.stringify(KC[w.n])).split(/\s+/).length/150));
const KT={d:"Tanım",c:"Karşılaştırma",l:"Liste",p:"Kim ne dedi",u:"Slayt uyarısı"};
function pageNums(p){const out=[];String(p).split(/[,;]/).forEach(part=>{const m=part.match(/(\d+)\s*[–-]\s*(\d+)/);if(m){for(let k=+m[1];k<=+m[2];k++)out.push(k)}else{const n=parseInt(part,10);if(!isNaN(n))out.push(n)}});return out}
function secByPage(w,p){let best=0,bd=1e9;w.sec.forEach((s,i)=>{pageNums(s.p).forEach(n=>{const d=Math.abs(n-p);if(d<bd){bd=d;best=i}})});return best}

/* ---------- data prep ---------- */
const TERMS=[],QS={};
W.sort((a,b)=>a.n-b.n);
W.forEach(w=>{
  w.cards.forEach(c=>{c.w=w.n;TERMS.push(c)});
  w.mcq.forEach(q=>{q.w=w.n;q.id="q"+hid(q.q);QS[q.id]=q});
  w.tf.forEach(t=>t.w=w.n);
  w.mcq2=(T2[w.n]||[]).map((q,i)=>{q.w=w.n;q.a=0;q.id="b"+w.n+"_"+i;QS[q.id]=q;return q});
});
const LV={easy:"Kolay",medium:"Orta",hard:"Zor"};
Object.keys(SIM).forEach(l=>SIM[l].forEach((q,i)=>{q.a=0;q.id="s"+l+i;QS[q.id]=q}));

/* ---------- ui state (nothing is stored between visits) ---------- */
const ui={gm:null,week:1,nq:"",jump:null,cw:null,pw:1,pm:"match",m:null,tf:null,g:null,t:null,tw:1,gq:"",tipw:1,ezw:1};

/* ---------- shared bits ---------- */
function weekChips(cur,act){
  return `<div class="chips" role="group" aria-label="Hafta seç">${W.map(w=>`<button class="chip" data-act="${act}" data-v="${w.n}" aria-pressed="${cur==w.n}">${wl(w.n)}</button>`).join("")}</div>`;
}
function tbl(t){return `<div class="tbl-wrap"><table><thead><tr>${t.h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${t.r.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}

/* ---------- home ---------- */
function vHome(){
  return `<section class="hero">
    <p class="eyebrow">ENMD345 · New Media Theories · W01–W07</p>
    <h1>Sınav çalışma masası</h1>
    <p class="lead">Yedi haftanın kartları, notları ve alıştırmaları tek yerde. Bütün içerik ders slaytlarından geliyor; her bilginin yanında slaydın sayfa numarası var.</p>
    <div class="cta-row">
      <a class="btn primary" href="#cards">Kartlarla çalış</a>
      <a class="btn brass" href="#test">Sınav simülasyonu</a>
    </div>
  </section>
  <section class="stack">
    <h2>Önerilen akış</h2>
    <div class="flowhint">
      <div><b>1. Kartlar</b><span>Haftanın kartlarını oku (yaklaşık 5 dk). Sınav için gereken her şey kartlarda.</span></div>
      <div><b>2. Alıştır</b><span>Eşleştir, Hızlı D/Y ve Grupla ile bilgiyi otur. Grupların mantığı Sınav tüyoları’nda.</span></div>
      <div><b>3. Test et</b><span>Haftalık Test 1 ve Test 2’yi çöz, sonra Kolay, Orta ve Zor simülasyonlarını dene.</span></div>
      <div><b>Sınav tüyoları</b><span>Grupların mantığı, kim ne dedi ve tüm önemli listeler tek yerde.</span></div>
      <div><b>Takıldığında</b><span>Karttaki sayfa etiketine dokun, ayrıntılı not açılsın.</span></div>
    </div>
  </section>
  <section class="stack">
    <h2>Haftalar</h2>
    <div class="weeks">${W.map(w=>`<article class="wk">
      <div class="wk-top"><span class="wk-n">${wl(w.n)}</span><span class="src">${esc(w.src)}</span></div>
      <div><h3>${w.en}</h3><p class="tr">${w.tr}</p></div>
      <div class="wk-stats"><span>${KC[w.n].length} kart · ~${mins(w)} dk</span><span>${w.mcq.length} test sorusu</span></div>
      <div class="wk-acts">
        <button class="btn sm primary" data-act="go" data-view="cards" data-v="${w.n}">Kartlar</button>
        <button class="btn sm" data-act="go" data-view="notes" data-v="${w.n}">Not</button>
        <button class="btn sm" data-act="go" data-view="practice" data-v="${w.n}">Alıştır</button>
        <button class="btn sm" data-act="go" data-view="test" data-v="${w.n}">Test</button>
      </div></article>`).join("")}</div>
  </section>`;
}

/* ---------- cards ---------- */
function vCards(){
  if(ui.cw==null){
    return `<div class="stack"><h1>Kartlar</h1><p class="lead">Her hafta, sınav için gereken bilgilerin sadeleştirilmiş özeti. Bir hafta seç.</p></div>
    <div class="weeks">${W.map(w=>`<button class="wk wk-btn" data-act="cweek" data-v="${w.n}">
      <div class="wk-top"><span class="wk-n">${wl(w.n)}</span><span class="src">${KC[w.n].length} kart · ~${mins(w)} dk</span></div>
      <div><h3>${w.en}</h3><p class="tr">${w.tr}</p></div>
      <span class="src">${esc(w.src)}</span></button>`).join("")}</div>`;
  }
  const w=W[ui.cw-1];
  return `<div class="stack">
    <div class="row"><button class="btn sm ghost" data-act="call">← Tüm haftalar</button></div>
    ${weekChips(ui.cw,"cweek")}
    <header class="wk-head"><p class="eyebrow">${wl(w.n)} · ${esc(w.src)} · ${KC[w.n].length} kart · ~${mins(w)} dk</p><h1>${w.en}</h1><p class="tr">${w.tr}</p></header>
    <div class="big"><p class="eyebrow">Büyük resim</p><p>${w.big}</p></div>
  </div>
  <div class="kgrid">${KC[w.n].map(c=>kcard(w,c)).join("")}</div>
  <div class="row">${w.n>1?`<button class="btn" data-act="cweek" data-v="${w.n-1}">← ${wl(w.n-1)}</button>`:""}<button class="btn primary" data-act="go" data-view="practice" data-v="${w.n}">${wl(w.n)} alıştırmaları</button>${w.n<W.length?`<button class="btn" data-act="cweek" data-v="${w.n+1}">${wl(w.n+1)} →</button>`:""}</div>`;
}

function kcard(w,c){
  let body="";
  if(c.k==="c")body=`<div class="kq-vs"><div><b>${c.a.n}</b><p>${c.a.x}</p></div><div><b>${c.b.n}</b><p>${c.b.x}</p></div></div>`;
  else if(c.k==="l")body=`<ul class="kq-list">${c.i.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  else body=`<p class="kq-x">${c.x}</p>`;
  const wide=c.k==="c"||(c.k==="l"&&c.i.length>3);
  return `<article class="kq kq-${c.k}${wide?" wide":""}">
    <span class="kq-type">${KT[c.k]}</span>
    <div class="kq-head"><h3>${c.t}</h3>${c.k==="p"||c.k==="u"?"":`<p class="kq-tr">${c.tr}</p>`}</div>
    ${body}
    ${c.n?`<p class="kq-n">${c.n}</p>`:""}
    <button class="ref ref-btn kq-ref" data-act="tonote" data-w="${w.n}" data-p="${c.p}" title="Ayrıntılı notu aç">${wl(w.n)} · s.${c.p} →</button>
  </article>`;
}

/* ---------- notes ---------- */
function block(b){
  if(b.t==="ul")return `<ul class="pts">${b.i.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(b.t==="note")return `<p class="callout">${b.x}</p>`;
  if(b.t==="flow")return `<ol class="flow">${b.i.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  if(b.t==="tbl")return tbl(b);
  return "";
}
function section(w,s,i){
  return `<article class="note" id="s-${w.n}-${i}"><div class="note-h"><div><h3>${s.en}</h3><p class="tr">${s.tr}</p></div>${ref(w.n,s.p)}</div>${s.b.map(block).join("")}</article>`;
}
function vNotes(){
  return `<div class="stack">${weekChips(ui.week,"nweek")}
    <input class="searchbox" id="note-q" type="search" placeholder="Tüm notlarda ara (Türkçe ya da İngilizce)…" value="${esc(ui.nq)}" autocomplete="off">
  </div><div id="note-body">${notesBody()}</div>`;
}
function notesBody(){
  const q=ui.nq.trim().toLocaleLowerCase("tr");
  if(q.length>=2){
    const hits=[];
    W.forEach(w=>w.sec.forEach((s,i)=>{if(lower(s.en+" "+s.tr+" "+JSON.stringify(s.b)).includes(q))hits.push([w,s,i])}));
    if(!hits.length)return `<p class="empty">“${esc(ui.nq)}” için sonuç yok.</p>`;
    return `<div class="notes"><p class="muted">${hits.length} bölüm bulundu</p>${hits.map(([w,s,i])=>section(w,s,i)).join("")}</div>`;
  }
  const w=W[ui.week-1];
  return `<div class="notes">
    <header class="wk-head"><p class="eyebrow">${wl(w.n)} · ${esc(w.src)} · ayrıntılı not</p><h1>${w.en}</h1><p class="tr">${w.tr}</p></header>
    <div class="big"><p class="eyebrow">Büyük resim</p><p>${w.big}</p></div>
    <nav class="toc" aria-label="Bölümler">${w.sec.map((s,i)=>`<button data-act="jump" data-v="s-${w.n}-${i}">${s.tr}</button>`).join("")}</nav>
    ${w.sec.map((s,i)=>section(w,s,i)).join("")}
    <div class="row"><button class="btn primary" data-act="go" data-view="cards" data-v="${w.n}">${wl(w.n)} kartlarına dön</button>${w.n<W.length?`<button class="btn" data-act="nweek" data-v="${w.n+1}">Sonraki hafta</button>`:""}</div>
  </div>`;
}

/* ---------- practice ---------- */
const PM=[["match","Eşleştir"],["tf","Hızlı D/Y"],["gr","Grupla"]];
function vPractice(){
  const w=W[ui.pw-1];
  const body=ui.pm==="match"?pMatch(w):ui.pm==="tf"?pTF(w):pGroup(w);
  return `<div class="stack">${weekChips(ui.pw,"pweek")}
    <div class="seg" role="group" aria-label="Alıştırma türü">${PM.map(([k,l])=>`<button data-act="pm" data-v="${k}" aria-pressed="${ui.pm===k}">${l}</button>`).join("")}</div></div>
    <section class="stack">${body}</section>`;
}
function pMatch(w){
  if(!ui.m||ui.m.w!==w.n)ui.m={w:w.n,i:0};
  const M=ui.m;const set=w.match[M.i%w.match.length];
  if(!M.L){M.L=shuffle(set.pairs.map((p,i)=>i));M.R=shuffle(set.pairs.map((p,i)=>i));M.sel=null;M.done=[];M.err=0;M.flash=null}
  const all=M.done.length===set.pairs.length;
  return `<div class="progress"><span>Set ${M.i%w.match.length+1}/${w.match.length}: <b style="color:var(--ink)">${set.t}</b></span><span>Hata ${M.err}</span></div>
  <p class="muted" style="font-size:.88rem">Soldan bir kavram, sağdan eşini seç.</p>
  <div class="match"><div class="col">${M.L.map(i=>`<button class="tile ${M.done.includes(i)?"ok":M.sel===i?"sel":""}" data-act="ml" data-v="${i}" ${M.done.includes(i)?"disabled":""}>${set.pairs[i][0]}</button>`).join("")}</div>
  <div class="col">${M.R.map(i=>`<button class="tile ${M.done.includes(i)?"ok":M.flash===i?"err":""}" data-act="mr" data-v="${i}" ${M.done.includes(i)?"disabled":""}>${set.pairs[i][1]}</button>`).join("")}</div></div>
  ${all?`<div class="fb ok"><b>Set tamamlandı.</b>${M.err?M.err+" hatayla bitirdin.":"Hiç hata yapmadın."}</div>`:""}
  <div class="row"><button class="btn ${all?"primary":""}" data-act="mnext">Sonraki set</button><button class="btn ghost" data-act="mreset">Bu seti karıştır</button></div>`;
}
function pTF(w){
  const T=ui.tf;
  if(!T||T.w!==w.n){
    const allN=Math.min(20,W.reduce((a,x)=>a+x.tf.length,0));
    return `<div class="panel stack" style="align-items:flex-start">
      <p class="lbl">Hızlı doğru / yanlış</p>
      <p>İfadeler tek tek gelir; <b>Doğru</b> ya da <b>Yanlış</b> de. Her cevaptan sonra açıklama gelir. Süre yok.</p>
      <div class="row"><button class="btn primary" data-act="tfstart" data-v="w">${wl(w.n)} ile başla (${w.tf.length} ifade)</button><button class="btn" data-act="tfstart" data-v="all">Tüm haftalardan ${allN} ifade</button></div></div>`;
  }
  if(T.k>=T.pool.length){
    return `<div class="panel stack" style="align-items:flex-start"><p class="lbl">Tur bitti</p><p class="bigscore">${T.score}/${T.pool.length}</p>
      ${T.wrong.length?`<p class="muted">Yanlış yaptıkların:</p><div class="review" style="width:100%">${T.wrong.map(x=>`<div class="rv bad"><span class="q">${x.s}</span><span>${x.e}</span>${ref(x.w,x.p)}</div>`).join("")}</div>`:`<p>Hepsini doğru bildin.</p>`}
      <div class="row"><button class="btn primary" data-act="tfagain">Yeni tur</button></div></div>`;
  }
  const it=T.pool[T.k];
  return `<div class="progress"><span>İfade ${T.k+1}/${T.pool.length}</span><span>Doğru ${T.score}</span></div>
  <p class="stmt">${it.s}</p>
  ${T.ans==null?`<div class="grade"><button class="btn yes" data-act="tfans" data-v="1" style="justify-content:center">Doğru</button><button class="btn no" data-act="tfans" data-v="0" style="justify-content:center">Yanlış</button></div>`:
  `<div class="fb ${T.ans===it.a?"ok":"bad"}"><b>${T.ans===it.a?"Doğru bildin.":"Bilemedin."}</b>${it.e} ${ref(it.w,it.p)}</div>
  <div class="row"><button class="btn primary" data-act="tfnext">${T.k+1<T.pool.length?"Sonraki":"Sonucu gör"}</button></div>`}`;
}
function startTF(scope){
  const pool=scope==="all"?shuffle(W.flatMap(w=>w.tf)).slice(0,20):shuffle(W[ui.pw-1].tf);
  ui.tf={w:ui.pw,pool,k:0,score:0,wrong:[],ans:null,scope};
}
function newGroupRun(sets,mixed){ui.g={sets,si:0,mixed,w:ui.pw};startSet()}
function startSet(){const G=ui.g;const set=G.sets[G.si];G.items=shuffle(set.i);G.k=0;G.pick=null;G.score=0;G.keys=false}
function pGroup(w){
  if(ui.g&&!ui.g.mixed&&ui.g.w!==w.n)ui.g=null;
  if(!ui.g){
    return `<div class="panel stack" style="align-items:flex-start">
      <p class="lbl">Grupla · keşif modu</p>
      <p>Kavramlar tek tek gelir; doğru gruba dokun. Grupların neye göre ayrıldığını kendin keşfet. Takılırsan “Anahtarı göster”e bas; set bitince her grubun anahtarı ve içeriği görünür.</p>
      <div class="row"><button class="btn primary" data-act="gstart">${wl(w.n)} setleri (${GR[w.n].length} set)</button><button class="btn brass" data-act="gmix">Karma tur</button></div>
      <p class="muted" style="font-size:.86rem">Karma tur, tüm haftalardan rastgele 5 set getirir.</p></div>`;
  }
  const G=ui.g,set=G.sets[G.si];
  const head=`<div class="progress"><span>${G.mixed?"Karma tur · ":""}Set ${G.si+1}/${G.sets.length}${G.mixed?" · "+wl(set.w):""}: <b style="color:var(--ink)">${set.t}</b></span><span>Doğru ${G.score}/${set.i.length}</span></div>`;
  if(G.k>=G.items.length){
    const cols=set.g.map((g,gi)=>`<div class="gcol"><h3>${g[0]}</h3><p class="gkey">${g[1]}</p><ul>${set.i.filter(x=>x[1]===gi).map(x=>`<li>${x[0]}</li>`).join("")}</ul></div>`).join("");
    return head+`<div class="fb ok"><b>Set bitti: ${G.score}/${set.i.length}</b>Grupların ayırma anahtarı ve içerikleri:</div>
      <div class="gsum">${cols}</div>
      <p class="muted" style="font-size:.85rem">Kaynak: ${ref(set.w,set.p)}</p>
      <div class="row">${G.si+1<G.sets.length?`<button class="btn primary" data-act="gnext">Sonraki set</button>`:`<button class="btn primary" data-act="gend">Bitir</button>`}<button class="btn ghost" data-act="gredo">Bu seti tekrarla</button></div>`;
  }
  const it=G.items[G.k];
  return head+`<p class="stmt">${it[0]}</p>
  <div class="gbtns">${set.g.map((g,gi)=>{let cls="";if(G.pick!=null){if(gi===it[1])cls="ok";else if(gi===G.pick)cls="bad"}
    return `<button class="opt gopt ${cls}" data-act="gpick" data-v="${gi}" ${G.pick!=null?"disabled":""}><b>${g[0]}</b>${G.keys?`<small>${g[1]}</small>`:""}</button>`}).join("")}</div>
  ${G.pick!=null?`<div class="fb ${G.pick===it[1]?"ok":"bad"}"><b>${G.pick===it[1]?"Doğru.":"Yanlış."} ${it[0]} → ${set.g[it[1]][0]}</b>Bu grubun ortak noktası: ${set.g[it[1]][1]}.</div>
  <div class="row"><button class="btn primary" data-act="gnextq">${G.k+1<G.items.length?"Sonraki":"Özeti gör"}</button></div>`:""}
  <div class="row"><button class="btn sm ghost" data-act="gkeys">${G.keys?"Anahtarı gizle":"Anahtarı göster"}</button><button class="btn sm ghost" data-act="gquit">Çık</button></div>`;
}

/* ---------- tips ---------- */
function vTips(){
  const w=W[ui.tipw-1];
  return `<div class="stack"><h1>Sınav tüyoları</h1><p class="lead">Farklar ve mantık: her kart iki kavramın ya da bir fikrin ayırt edici noktasını en fazla iki cümleyle anlatır. Düşünürün adı ve not linki kartın üstünde.</p>
    ${weekChips(ui.tipw,"tipw")}</div>
    <h2 class="ez-h"><span class="ez-dot ez-d"></span>${wl(w.n)} · Farklar ve mantık</h2>
    <div class="fm-grid">${FM[w.n].map(c=>`<article class="fm">
      <div class="tip-h"><div><h3>${c.t}</h3><p class="kq-tr">${c.tr}</p></div>${refLink(w.n,c.p)}</div>
      ${c.who?`<span class="fm-who">${c.who}</span>`:""}
      <div class="fm-x">${c.x.split(/(?<=[.!?])\s+(?=[A-ZÇĞİÖŞÜ“(])/).map(t=>`<p>${t}</p>`).join("")}</div></article>`).join("")}</div>

function gPool(w){

  const skip=new Set(G.skip||[]);
  return out.filter(q=>!skip.has(q.q)).map(q=>{if(!q.h)q.h=G.hints[q.q]||null;return q});
}

function gStageOf(w,p){const S=GAME[w].stages;let i=S.findIndex(s=>p>=s.from&&p<=s.to);if(i<0)i=S.findIndex(s=>p<=s.to);return i<0?S.length-1:i}
function gSecs(w,si){const st=GAME[w].stages[si],wk=W[w-1];
  return wk.sec.map((s,i)=>[s,i]).filter(([s])=>parseInt(s.p,10)>=st.from&&parseInt(s.p,10)<=st.to).map(([s,i])=>section(wk,s,i)).join("")}
function gNew(w){if(!GP[w])GP[w]=gPool(w);
  ui.gm={w,si:0,php:GB.hp,pmax:GB.hp,jok:{tut:2,elim:2,shield:2},shield:false,streak:0,phase:"map",wrong:[],modal:null,stats:{ok:0,bad:0}}}
function gBegin(){const G=ui.gm;
  if(G.mixed){const c=GMIX[G.lv];Object.assign(G,{boss:true,ehp:c.hp,emax:c.hp,edmg:c.dmg,pool:shuffle(gMixPool(G.lv)),qi:-1,streak:0,phase:"fight",fx:"",log:""});gNext();return}
  const boss=G.si>=GAME[G.w].stages.length,cfg=boss?GB.boss:GB.enemy;
  const ids=GP[G.w].filter(q=>boss||gStageOf(G.w,q.p)===G.si).map(q=>q.id);
  Object.assign(G,{boss,ehp:cfg.hp,emax:cfg.hp,edmg:cfg.dmg,pool:shuffle(ids),qi:-1,streak:0,phase:"fight",fx:"",log:""});gNext()}
function gNext(){const G=ui.gm;G.qi++;
  if(G.qi>=G.pool.length){const last=G.cur;G.pool=shuffle(G.pool);if(G.pool[0]===last&&G.pool.length>1)G.pool.push(G.pool.shift());G.qi=0}
  G.cur=G.pool[G.qi];G.opts=shuffle([0,1,2,3]);G.elim=[];G.ans=null;G.hint=false;G.tr=false;G.fx="";G.log=""}
function gEnemy(){const G=ui.gm;if(G.mixed)return GMIX.boss;const st=GAME[G.w];return G.boss?st.boss:st.stages[G.si].enemy}
function hpBar(v,max,cls){const pc=Math.max(0,Math.round(v/max*100));return `<div class="hp ${cls}"><i style="width:${pc}%"></i><span>${Math.max(0,v)}/${max}</span></div>`}

function gTop(){const G=ui.gm;

function gMap(){const G=ui.gm,st=GAME[G.w];

function gTut(){const G=ui.gm;

      <div class="row"><button class="btn primary" data-act="gmnext">${G.ehp<=0?"Düşman yenildi →":G.php<=0?"Devam →":"Sonraki soru →"}</button></div>`:

     ${G.hint?(q.h?`<div class="gm-hint"><p><span class="lbl">TR</span> ${q.h[0]}</p><p><span class="lbl">EN</span> ${q.h[1]}</p></div>`:`<div class="gm-hint"><p class="muted">Bu soru için ipucu yok.</p></div>`):""}`}
  </div>

function gWon(){const G=ui.gm,st=GAME[G.w],e=gEnemy();

    ${wr.length?`<h2>Yanlış yaptıkların</h2><div class="review">${wr.map(id=>{const q=QS[id];return `<div class="rv bad"><span class="q">${q.q}</span>

function gModal(){const G=ui.gm,m=G.modal;
  if(m==="tutview"){const q=QS[G.cur],ww=G.mixed?q.w:G.w,si=G.boss?gStageOf(ww,q.p):G.si,s=GAME[ww].stages[si];
    return `<div class="gm-modal" role="dialog" aria-label="Konu anlatımı"><div class="gm-box wide"><div class="row" style="justify-content:space-between"><div><p class="lbl">📖 Konu anlatımı · ${wl(ww)} · Aşama ${si+1}</p><h2>${s.en}</h2></div><button class="btn sm" data-act="gmclose">Kapat ✕</button></div>
      <div class="gm-notes">${gSecs(ww,si)}</div><div class="row"><button class="btn primary" data-act="gmclose">Soruya dön</button></div></div></div>`}
  const k=m.slice(2),j=GJ[k],left=G.jok[k];

  else if(k==="elim"&&G.elim.length){can=false;why="Bu soruda zaten kullandın."}

    <div class="row"><button class="btn primary" data-act="gmjuse" data-v="${k}" ${can?"":"disabled"}>Kullan</button><button class="btn ghost" data-act="gmclose">Vazgeç</button></div></div></div>`}
function gAnswer(v){const G=ui.gm,q=QS[G.cur];if(G.ans!=null)return;G.ans=v;
  if(v===q.a){const dmg=GB.hit+(G.streak>=3?GB.combo:0);G.streak++;G.ehp-=dmg;G.fx="hit";G.log=`−${dmg}${dmg>GB.hit?" 🔥":""}`;G.stats.ok++}
  else{G.streak=0;G.stats.bad++;G.wrong.push(G.cur);
    if(G.shield){G.shield=false;G.fx="block";G.log="🛡️ Engellendi"}else{G.php-=G.edmg;G.fx="hurt";G.log=`−${G.edmg}`}}}
const GA={
  gmweek:t=>{gNew(+t.dataset.v);render();window.scrollTo(0,0)},
  gmquit:()=>{ui.gm=null;render();window.scrollTo(0,0)},
  gmmap:()=>{ui.gm.phase="map";render();window.scrollTo(0,0)},
  gmtut:()=>{ui.gm.phase="tut";render();window.scrollTo(0,0)},
  gmfight:()=>{gBegin();render();window.scrollTo(0,0)},

};

/* ---------- router ---------- */
const VIEWS={home:vHome,cards:vCards,notes:vNotes,practice:vPractice,tips:vTips,test:vTest,people:vPeople,glossary:vGlossary,game:vGame};
const NAV=[["home","Ana sayfa"],["cards","Kartlar"],["notes","Notlar"],["practice","Alıştırma"],["tips","Sınav tüyoları"],["test","Test"],["game","Oyun"],["people","Kim kimdir"],["glossary","Sözlük"]];
let cur="home";
function renderNav(){$("#rail").innerHTML=NAV.map(([k,l])=>`<a href="#${k}" ${cur===k?'aria-current="page"':""}>${l}</a>`).join("")}
function render(){
  renderNav();
  $("#app").innerHTML=VIEWS[cur]();
  if(ui.jump){const id=ui.jump;ui.jump=null;requestAnimationFrame(()=>{const el=document.getElementById(id);if(el){el.scrollIntoView({block:"start"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600)}})}
}
function route(){
  const v=(location.hash||"#home").slice(1);
  const next=VIEWS[v]?v:"home";
  if(next==="cards"&&next!==cur&&!ui.keepCw)ui.cw=null;
  ui.keepCw=false;
  if(next!==cur){cur=next;if(!ui.jump)window.scrollTo(0,0)}
  render();
}
function go(view,w){
  if(w!=null){const n=+w;
    if(view==="notes"){ui.week=n;ui.nq=""}
    if(view==="cards"){ui.cw=n;ui.keepCw=true}
    if(view==="practice"){ui.pw=n;if(ui.g&&!ui.g.mixed)ui.g=null}
    if(view==="test"){ui.tw=n;if(ui.t&&ui.t.done)ui.t=null}
  }
  if(location.hash==="#"+view){cur=view;render();if(!ui.jump)window.scrollTo(0,0)}else location.hash=view;
}

/* ---------- actions ---------- */
const A={
  go:t=>go(t.dataset.view,t.dataset.v),
  simgo:(el)=>{const l=el.dataset.v||"medium";newTest("sim",simIds(l));ui.t.lv=l;go("test")},
  cweek:t=>{ui.cw=+t.dataset.v;render();window.scrollTo(0,0)},
  call:()=>{ui.cw=null;render();window.scrollTo(0,0)},
  tonote:t=>{const w=W[+t.dataset.w-1];ui.jump="s-"+w.n+"-"+secByPage(w,parseInt(t.dataset.p,10));go("notes",w.n)},
  nweek:t=>{ui.week=+t.dataset.v;ui.nq="";render();window.scrollTo(0,0)},
  jump:t=>{const el=document.getElementById(t.dataset.v);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})},
  pweek:t=>{ui.pw=+t.dataset.v;ui.tf=null;if(ui.g&&!ui.g.mixed)ui.g=null;render()},
  pm:t=>{ui.pm=t.dataset.v;ui.tf=null;render()},
  ml:t=>{ui.m.sel=+t.dataset.v;ui.m.flash=null;render()},
  mr:t=>{const M=ui.m,r=+t.dataset.v;if(M.sel==null)return;if(M.sel===r){M.done.push(r);M.sel=null;M.flash=null}else{M.err++;M.flash=r}render()},
  mnext:()=>{ui.m.i++;ui.m.L=null;render()},
  mreset:()=>{ui.m.L=null;render()},
  tfstart:t=>{startTF(t.dataset.v);render()},
  tfagain:()=>{startTF(ui.tf.scope);render()},
  tfans:t=>{const T=ui.tf;if(!T||T.ans!=null)return;const it=T.pool[T.k];T.ans=t.dataset.v==="1";if(T.ans===it.a)T.score++;else T.wrong.push(it);render()},
  tfnext:()=>{const T=ui.tf;T.k++;T.ans=null;render()},
  gstart:()=>{newGroupRun(shuffle(GR[ui.pw].map(x=>Object.assign({w:ui.pw},x))),false);render()},
  gmix:()=>{const all=W.flatMap(w=>GR[w.n].map(x=>Object.assign({w:w.n},x)));newGroupRun(shuffle(all).slice(0,5),true);render()},
  gpick:t=>{const G=ui.g;if(G.pick!=null)return;G.pick=+t.dataset.v;if(G.pick===G.items[G.k][1])G.score++;render()},
  gnextq:()=>{const G=ui.g;G.k++;G.pick=null;render()},
  gkeys:()=>{ui.g.keys=!ui.g.keys;render()},
  gnext:()=>{ui.g.si++;startSet();render();window.scrollTo(0,0)},
  gredo:()=>{startSet();render()},
  gend:()=>{ui.g=null;render()},
  gquit:()=>{ui.g=null;render()},
  gogr:t=>{ui.pm="gr";go("practice",t.dataset.v)},
  tipw:t=>{ui.tipw=+t.dataset.v;render();window.scrollTo(0,0)},
  tweek:t=>{ui.tw=+t.dataset.v;render()},
  tstart:(el)=>{const n=el.dataset.v==="2"?2:1,w=W[ui.tw-1];newTest("week",shuffle(n===2?w.mcq2:w.mcq).map(q=>q.id));ui.t.set=n;render()},
  ttr:()=>{ui.t.tr=!ui.t.tr;render()},
  tans:t=>{const T=ui.t,id=T.qs[T.i];if(T.ans[id]!=null)return;T.ans[id]=+t.dataset.v;render()},
  tnext:()=>{const T=ui.t;T.tr=false;if(T.i+1<T.qs.length){T.i++}else{T.done=true}render();window.scrollTo(0,0)},
  tquit:()=>{ui.t=null;render()}
};
Object.assign(A,GA);
document.addEventListener("click",e=>{if(cur==="cards"&&e.target.closest('#rail a[href="#cards"]')){ui.cw=null;render();window.scrollTo(0,0);return}const t=e.target.closest("[data-act]");if(!t||t.tagName==="INPUT")return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener("input",e=>{
  if(e.target.id==="note-q"){ui.nq=e.target.value;$("#note-body").innerHTML=notesBody()}
  if(e.target.id==="gl-q"){ui.gq=e.target.value;$("#gl-body").innerHTML=glBody()}
});
window.addEventListener("hashchange",route);
route();
})();
</script>
